"NewLife.NovaDb Hybrid Database": "قاعدة بيانات NewLife.NovaDb الهجينة"
"A medium-to-large hybrid database infrastructure implemented in C# for the .NET platform: dual embedded/network modes, integrating relational, time-series, message queue, and NoSQL (KV) engines; NativeAOT-ready, with built-in runtime localization.": "بنية تحتية لقاعدة بيانات هجينة متوسطة إلى كبيرة مكتوبة بلغة C# لمنصة .NET: وضعان مضمّنان/شبكي، تدمج المحركات العلائقية والسلاسل الزمنية وقوائم انتظار الرسائل وNoSQL (KV)؛ جاهزة لـ NativeAOT مع دعم متعدد اللغات في وقت التشغيل."
