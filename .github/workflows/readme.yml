name: readme

on:
  push:
    branches: [ '*' ]
    paths:
      - 'README*.md'
      - 'readme-*.json'
      - 'tools/*.ps1'
      - '.github/workflows/readme.yml'
  pull_request:
    branches: [ '*' ]
    paths:
      - 'README*.md'
      - 'readme-*.json'
      - 'tools/*.ps1'
      - '.github/workflows/readme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  languages:
    name: README languages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4
    - name: Check README language switcher
      shell: pwsh
      run: pwsh -NoProfile -File ./tools/sync-readme-languages.ps1 -Check
