name: test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  # 全解决方案编译校验（含 NovaServer/AotSmoke/Benchmark 等非测试工程），与测试矩阵并行运行
  build:
    name: build solution
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        # 解决方案多目标 net45~net10，net45/net461 由 SDK 自动引用参考程序集包
        dotnet-version: |
          8.x
          10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Build
      run: dotnet build -c Release

  # 测试矩阵：RID × 目标框架，逐个独立 job 运行（并行互不争抢）。
  # 覆盖 win-x64 / linux-x64 / linux-arm64，阻断门禁；linux-la64（龙芯）由独立 QEMU job 承担。
  # 每个 job 使用 -f 指定单一目标框架，避免多框架并行争抢同一测试数据目录。
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # ================= Windows x64 =================
          - name: win-x64-net8.0
            os: windows-latest
            framework: net8.0
            dotnet: |
              8.x
              10.x
          - name: win-x64-net10.0
            os: windows-latest
            framework: net10.0
            dotnet: 10.x
          # ================= Linux x64 =================
          - name: linux-x64-net8.0
            os: ubuntu-latest
            framework: net8.0
            dotnet: |
              8.x
              10.x
          - name: linux-x64-net10.0
            os: ubuntu-latest
            framework: net10.0
            dotnet: 10.x
          # ================= Linux arm64 =================
          - name: linux-arm64-net8.0
            os: ubuntu-24.04-arm
            framework: net8.0
            dotnet: |
              8.x
              10.x
          - name: linux-arm64-net10.0
            os: ubuntu-24.04-arm
            framework: net10.0
            dotnet: 10.x

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet }}
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Test
      # blame-hang：用例挂起时超时转储，便于事后定位；dump-type 取值 full/mini/none 区分大小写
      run: dotnet test XUnitTest/XUnitTest.csproj -f ${{ matrix.framework }} -c Release --blame-hang-timeout 15m --blame-hang-dump-type mini --logger "trx;LogFileName=${{ matrix.name }}.trx" --results-directory TestResults
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.name }}
        path: TestResults/*.trx
        if-no-files-found: ignore

  # Linux LoongArch64（LA64，QEMU）：GitHub 无 LA64 runner/runtime pack，
  # 采用 docker + QEMU 用户态仿真（loong64 binfmt）+ 龙芯 SDK 在 loong64 容器内跑 net10.0 全量单测。
  # 基础镜像 lcr.loongnix.cn/debian:14-slim 为 Debian unstable loong64 端口，自带 loader 与可用 apt；
  # 容器内补装 libicu/libssl，使全球化/加密用例与其它 Linux job 行为一致。
  # vstest 不可用（龙芯 SDK 版不认识 LoongArch64 架构、宿主版是 x64 R2R 无法加载），改自宿主 xunit 执行器。
  # 非阻塞门禁：QEMU 仿真与第三方龙芯 SDK 均不受本仓库控制，失败不阻断合入，仅作兼容性参考。
  loongarch64:
    name: test (linux-la64 qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET (host, for restore)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Set up QEMU (loong64)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: loong64
    - name: Download Loongson .NET SDK (linux-loongarch64)
      # 宿主下载（GitHub 直连快），容器通过挂载点使用；容器内 --info 是 QEMU 通路的第一道验证
      run: |
        curl -fL -o "$HOME/la64-sdk.tar.gz" \
          https://github.com/loongson/dotnet/releases/download/v10.0.113-loongarch64/dotnet-sdk-10.0.113-linux-loongarch64.tar.gz
        mkdir -p "$HOME/la64" && tar -xzf "$HOME/la64-sdk.tar.gz" -C "$HOME/la64"
        chmod +x "$HOME/la64/dotnet" || true
    - name: Restore NuGet Packages (host x64 SDK)
      # 龙芯 SDK 在 QEMU 下的 MSBuild 链路不稳（NuGet 还原触发 RemoveDuplicates 任务 NRE，MSB4018），
      # 还原与构建均放宿主 x64 SDK：默认构建产出 RID 无关的 IL 与可移植 deps.json，
      # 容器内仅以 LA64 运行时执行测试；包目录保持 $HOME/.nuget/packages 同路径挂载
      run: dotnet restore XUnitTest/XUnitTest.csproj
    - name: Build Test Assembly (host x64 SDK)
      run: dotnet build XUnitTest/XUnitTest.csproj -c Release -f net10.0 --no-restore
    - name: Build Self-host xUnit Runner (host x64 SDK)
      # 龙芯 SDK 自带 vstest 不识别 LoongArch64 架构，宿主 SDK 的 vstest 是 x64 R2R 复合镜像无法在 LA64 加载，
      # 故完全绕开 vstest：用 xunit.runner.utility 构建极简自宿主执行器（纯 IL，可在 LA64 运行），
      # 容器内以 LA64 运行时直接执行测试程序集；失败明细打印为 FAIL <用例>: <消息>
      run: |
        mkdir -p /tmp/selfhost
        cat > /tmp/selfhost/xr.csproj <<'EOF'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <OutputType>Exe</OutputType>
            <TargetFramework>net10.0</TargetFramework>
            <Nullable>disable</Nullable>
            <LangVersion>latest</LangVersion>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="xunit.runner.utility" Version="2.9.3" />
          </ItemGroup>
        </Project>
        EOF
        cat > /tmp/selfhost/Program.cs <<'EOF'
        using System;
        using System.IO;
        using System.Threading;
        using Xunit.Runners;

        if (args.Length < 1)
        {
            Console.WriteLine("用法: xr <testAssembly.dll>");
            return 2;
        }

        var path = Path.GetFullPath(args[0]);
        var testDir = Path.GetDirectoryName(path)!;

        // 无 AppDomain 模式下，xunit 以 Assembly.Load(名称) 装载测试程序集，
        // 需要把测试输出目录挂到默认加载上下文的解析链上
        System.Runtime.Loader.AssemblyLoadContext.Default.Resolving += (ctx, name) =>
        {
            var file = Path.Combine(testDir, name.Name + ".dll");

            return File.Exists(file) ? ctx.LoadFromAssemblyPath(file) : null;
        };

        var pass = 0;
        var fail = 0;
        var skip = 0;

        using var runner = AssemblyRunner.WithoutAppDomain(path);
        runner.OnTestPassed = _ => Interlocked.Increment(ref pass);
        runner.OnTestSkipped = _ => Interlocked.Increment(ref skip);
        runner.OnTestFailed = info =>
        {
            Interlocked.Increment(ref fail);
            Console.WriteLine($"FAIL {info.TestDisplayName}: {info.ExceptionMessage}");
        };

        var done = new ManualResetEventSlim(false);
        runner.OnExecutionComplete = info =>
        {
            Console.WriteLine($"TOTAL pass={pass} fail={fail} skip={skip} time={info.ExecutionTime:n1}s");
            done.Set();
        };

        runner.Start();
        done.Wait();

        return fail > 0 ? 1 : 0;
        EOF
        dotnet build /tmp/selfhost/xr.csproj -c Release --nologo
    - name: Unit Tests (net10.0) in loong64 Container
      # DOTNET_EnableHWIntrinsic=0：QEMU 用户态对 LASX/LSX 指令覆盖不全，JIT 动态桩实测触发
      # Illegal instruction（ExecutionEngineException），关闭硬件内建以强制基线指令；
      # 自宿主执行器连同其依赖复制进测试输出目录，保证 AppContext.BaseDirectory 与 VSTest 一致；
      # QEMU 下核数少且慢，写入 xunit.runner.json 压并行到 4，避免过度订阅导致时序用例失真
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
      run: |
        docker run --rm --platform linux/loong64 \
          -v "$PWD:/src" -w /src \
          -v "$HOME/la64:/opt/dotnet" \
          -v "$HOME/.nuget/packages:/home/runner/.nuget/packages" \
          -v "/tmp/selfhost/bin/Release/net10.0:/opt/selfhost:ro" \
          -e NUGET_PACKAGES=/home/runner/.nuget/packages \
          -e DOTNET_ROOT=/opt/dotnet \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e DOTNET_EnableHWIntrinsic=0 \
          lcr.loongnix.cn/debian:14-slim \
          sh -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends libicu-dev libssl-dev >/dev/null
            /opt/dotnet/dotnet --info
            cd /src/Bin/UnitTest/net10.0
            cp /opt/selfhost/* .
            printf "{ \"maxParallelThreads\": 4 }" > xunit.runner.json
            timeout 240m /opt/dotnet/dotnet ./xr.dll ./XUnitTest.dll
          '