name: aot

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  # AOT 防回归：分析器 0 告警检查（与 RID 无关，单一 job）。
  # 非阻塞：AOT 相关校验仅作参考，失败不阻断合入（如需强约束，去掉本 job 的 continue-on-error）。
  aot-analyzer:
    name: aot analyzer check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotNET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.x
          10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: AOT Analyzer Check
      # 库自身 AOT/裁剪分析器告警（net8.0/net10.0，当前 0 条）；-warnaserror 使新增告警阻断
      run: |
        dotnet build NewLife.NovaDb/NewLife.NovaDb.csproj -f net8.0 -c Release -warnaserror
        dotnet build NewLife.NovaDb/NewLife.NovaDb.csproj -f net10.0 -c Release -warnaserror

  # NativeAOT 冒烟矩阵：NativeAOT 官方不支持跨 OS 编译，每个 RID 用原生 runner 发布运行。
  # win-x64 / linux-x64 / linux-arm64 覆盖主流 RID；非阻塞：AOT 校验失败不阻断合入。
  # LA64（linux-loongarch64，QEMU）见本文件末尾 job。
  aot:
    name: aot (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            bin: AotSmoke.exe
          - rid: linux-x64
            os: ubuntu-latest
            bin: AotSmoke
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            bin: AotSmoke

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotNET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Install NativeAOT Prerequisites (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: JIT Baseline
      # 同一冒烟工程以 JIT 运行（14 场景），为 AOT 结果提供对照
      run: dotnet run -c Release --project AotSmoke/AotSmoke.csproj
    - name: Publish NativeAOT Smoke
      run: dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o AotSmoke/bin/aot-out
    - name: Run NativeAOT Smoke
      # 任一场景失败即非 0 退出码
      shell: bash
      run: ./AotSmoke/bin/aot-out/${{ matrix.bin }}

  # LoongArch64（linux-loongarch64，QEMU）：GitHub 无 LA64 runner/runtime pack。
  # 方案：docker + QEMU 用户态仿真（loong64 binfmt）+ 龙芯 SDK。
  # 以 LA64 运行时执行同一冒烟（15 场景），验证库在龙芯平台的行为一致性；
  # 探索部分：尝试 NativeAOT 发布 linux-loongarch64（ILCompiler 未见 LA64 官方承诺）。
  # 非阻塞：QEMU 仿真与第三方龙芯 SDK 不受本仓库控制，失败不阻断合入。
  loongarch64:
    name: aot (linux-loongarch64 qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotNET (host, for restore)
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x
    - name: Set up QEMU (loong64)
      uses: docker/setup-qemu-action@v4
      with:
        platforms: loong64
    - name: Download Loongson .NET SDK (linux-loongarch64)
      # 宿主下载（GitHub 直连快），容器通过挂载点使用
      run: |
        curl -fL -o "$HOME/la64-sdk.tar.gz" \
          https://github.com/loongson/dotnet/releases/download/v10.0.113-loongarch64/dotnet-sdk-10.0.113-linux-loongarch64.tar.gz
        mkdir -p "$HOME/la64" && tar -xzf "$HOME/la64-sdk.tar.gz" -C "$HOME/la64"
        chmod +x "$HOME/la64/dotnet" || true
    - name: Restore & Build AotSmoke (host x64 SDK)
      # 龙芯 SDK 在 QEMU 下的 MSBuild 链路不稳，还原与构建均放宿主 x64 SDK（产出 RID 无关 IL），
      # 容器内仅以 LA64 运行时执行
      run: |
        dotnet restore AotSmoke/AotSmoke.csproj
        dotnet build AotSmoke/AotSmoke.csproj -c Release --no-restore
    - name: JIT Smoke in loong64 Container (AotSmoke 14 场景)
      # DOTNET_EnableHWIntrinsic=0：QEMU 用户态对 LASX/LSX 指令覆盖不全，关闭硬件内建以强制基线指令
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
      run: |
        docker run --rm --platform linux/loong64 \
          -v "$PWD:/src" -w /src \
          -v "$HOME/la64:/opt/dotnet" \
          -v "$HOME/.nuget/packages:/home/runner/.nuget/packages" \
          -e NUGET_PACKAGES=/home/runner/.nuget/packages \
          -e DOTNET_ROOT=/opt/dotnet \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e DOTNET_EnableHWIntrinsic=0 \
          lcr.loongnix.cn/debian:14-slim \
          sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends libicu-dev libssl-dev >/dev/null && /opt/dotnet/dotnet --info && /opt/dotnet/dotnet /src/AotSmoke/bin/Release/net10.0/AotSmoke.dll'
    - name: NativeAOT Publish (linux-loongarch64, 探索)
      continue-on-error: true
      run: |
        docker run --rm --platform linux/loong64 \
          -v "$PWD:/src" -w /src \
          -v "$HOME/la64:/opt/dotnet" \
          -v "$HOME/.nuget/packages:/home/runner/.nuget/packages" \
          -e NUGET_PACKAGES=/home/runner/.nuget/packages \
          -e DOTNET_ROOT=/opt/dotnet \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          lcr.loongnix.cn/debian:14-slim \
          sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends clang zlib1g-dev >/dev/null && /opt/dotnet/dotnet publish AotSmoke/AotSmoke.csproj -c Release -r linux-loongarch64 -o AotSmoke/bin/aot-out-la64'
    - name: Run NativeAOT Smoke (linux-loongarch64, 探索)
      continue-on-error: true
      run: |
        if [ -x AotSmoke/bin/aot-out-la64/AotSmoke ]; then
          docker run --rm --platform linux/loong64 \
            -v "$PWD:/src" -w /src \
            lcr.loongnix.cn/debian:14-slim \
            ./AotSmoke/bin/aot-out-la64/AotSmoke
        else
          echo "未产出 linux-loongarch64 原生可执行文件（NativeAOT 当前不支持 LA64），跳过运行"
        fi